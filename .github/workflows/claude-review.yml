name: Claude Review

on:
  workflow_call:
    inputs:
      federation_rule_id:
        description: Anthropic federation rule ID (fdrl_...)
        required: true
        type: string
      organization_id:
        description: Anthropic organization UUID
        required: true
        type: string
      service_account_id:
        description: Anthropic service account ID (svac_...)
        required: true
        type: string
      workspace_id:
        description: Anthropic workspace ID (wrkspc_...). Only needed if the rule covers several workspaces.
        required: false
        type: string
        default: ""

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ inputs.federation_rule_id }}
          anthropic_organization_id: ${{ inputs.organization_id }}
          anthropic_service_account_id: ${{ inputs.service_account_id }}
          anthropic_workspace_id: ${{ inputs.workspace_id }}
          prompt: |
            Review this PR for bugs, security issues, and unclear code.

            Rules:
            - Only comment on real problems. No praise, no restating what the code does.
            - Inline comments: 1-2 sentences each. State the problem and the fix.
            - Summary: max 5 bullets, one line each. If nothing is wrong, say "LGTM" and stop.
            - Skip style nitpicks unless they hide a bug.
